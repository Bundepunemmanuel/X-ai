services:
  - type: web
    name: x-reply-assistant
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: X_USERNAME
        sync: false
      - key: X_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PRODUCT_NAME
        value: Kairo
      - key: PRODUCT_URL
        value: https://kairo-omega.vercel.app/
      - key: HEADLESS
        value: "true"
