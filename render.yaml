services:
  - type: web
    name: x-reply-assistant
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: X_USERNAME
        sync: false
      - key: X_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PRODUCT_NAME
        value: Kairo
      - key: PRODUCT_URL
        value: https://kairo-omega.vercel.app/
      - key: HEADLESS
        value: "true"
